name: Release apps

# Builds the standalone apps (no Python needed) and attaches them to a GitHub
# Release. Two ways to release:
#   - push a version tag:  git tag v1.2.3 && git push origin v1.2.3
#   - Actions tab → "Release apps" → Run workflow → publish = true
#     (releases the version in art_manager/__init__.py; the tag is created for you)
# Run it with publish = false to just build and test the apps.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release for the version in art_manager/__init__.py"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, file: art-manager-windows-x64.exe }
          - { os: macos-latest,   name: macos-arm64, file: art-manager-macos-arm64 }
          - { os: ubuntu-22.04,   name: linux-x64,   file: art-manager-linux-x64 }   # older glibc = runs on more distros
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: pip install -r requirements.txt "pyinstaller>=6.10"   # 6.9+: PYINSTALLER_RESET_ENVIRONMENT
      - name: Build
        run: pyinstaller --noconfirm packaging/art-manager.spec
      - name: Rename
        run: |
          src=dist/art-manager; [ -f dist/art-manager.exe ] && src=dist/art-manager.exe
          mkdir -p out && cp "$src" "out/${{ matrix.file }}" && ls -la out
      - name: Smoke test (starts, serves the page, scans a folder)
        run: |
          mkdir -p "smoke/music/Some Artist/Some Album" smoke/data && touch "smoke/music/Some Artist/Some Album/01.flac"
          ./out/${{ matrix.file }} --version
          ARTMGR_DATA_DIR=smoke/data ./out/${{ matrix.file }} smoke/music --port 5077 --no-browser > smoke/server.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:5077/ > /dev/null && break; sleep 1; done
          cat smoke/server.log
          # save first: `curl | grep -q` fails with pipefail when grep stops reading early
          curl -sf localhost:5077/ -o smoke/page.html && grep -q "<title>Art Manager" smoke/page.html
          curl -sf localhost:5077/api/scan -o smoke/scan.json && grep -q '"name":"Some Artist"' smoke/scan.json
          # the update check must get through TLS with the certificates bundled in the app
          curl -sf -X POST -H 'Content-Type: application/json' -d '{}' localhost:5077/api/update/check -o smoke/update.json
          cat smoke/update.json
          if grep -q CERTIFICATE smoke/update.json; then echo "TLS certificate problem"; exit 1; fi
      - name: Zip (macOS keeps the executable bit)
        if: runner.os == 'macOS'
        run: cd out && zip ${{ matrix.file }}.zip ${{ matrix.file }} && rm ${{ matrix.file }}
      - name: Self-update test (an older build updates itself to this one)
        run: |
          VERSION=$(python -c "import re;print(re.search(r\"__version__ = .([0-9.]+).\", open('art_manager/__init__.py').read()).group(1))")
          mkdir -p old-src && cp -r app.py art_manager packaging pyproject.toml README.md LICENSE old-src/
          sed -i.bak "s/__version__ = '[0-9.]*'/__version__ = '0.0.1'/" old-src/art_manager/__init__.py
          (cd old-src && pyinstaller --noconfirm --log-level WARN --distpath ../dist-old --workpath ../build-old packaging/art-manager.spec)
          OLD=dist-old/art-manager; [ -f dist-old/art-manager.exe ] && OLD=dist-old/art-manager.exe
          ASSET=out/${{ matrix.file }}; [ -f "$ASSET.zip" ] && ASSET="$ASSET.zip"
          python packaging/test_update.py "$OLD" "$ASSET" "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(python3 -c 'import re;print(re.search(r"__version__ = .([0-9.]+).", open("art_manager/__init__.py").read()).group(1))')"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG is already released — bump the version in art_manager/__init__.py first"; exit 1
            fi
          fi
          gh release create "$TAG" assets/* --target "$GITHUB_SHA" \
            --title "Art Manager ${TAG#v}" \
            --notes-file packaging/RELEASE_NOTES.md
